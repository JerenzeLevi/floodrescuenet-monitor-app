<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/png" href="/assets/app-icon.png" />
<title>401 · Nice try</title>
<style>
  html,body{margin:0;height:100%;background:#03101f;color:#8fa6c4;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;padding:32px;text-align:center}
  img{width:min(60vw,240px);height:auto;image-rendering:auto;border-radius:12px}
  code{color:#38bdf8}
  p{margin:0;font-size:14px;line-height:1.7;max-width:36ch}
  .small{font-size:12px;opacity:.6}
</style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/nope.png" alt="" />
    <p><code>GET /api</code> → <strong>401 Unauthorized</strong><br />
    There is no API here. This is a static site.</p>
    <p class="small">If you were poking around looking for one — this is the response you get.</p>
  </div>
</body>
</html>
